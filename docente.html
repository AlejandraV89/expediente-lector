<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Docente — Expediente Lector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181f; --ink-2:#1c222c; --paper:#f3edda; --paper-2:#e9e1c8;
    --text-on-ink:#e8e3d3; --text-muted:#9a9686;
    --amber:#c9722e; --teal:#3e7c7c; --red:#a63a3a; --green:#4a7c3e;
    --border-ink: rgba(232,227,211,0.15);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ink); color:var(--text-on-ink); font-family:'Inter',sans-serif; min-height:100vh; }
  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
  header{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--border-ink); padding-bottom:16px; margin-bottom:24px; flex-wrap:wrap; gap:8px; }
  header h1{ font-family:'Special Elite',monospace; font-size:22px; font-weight:400; margin:0; color:var(--paper); }
  header .sub{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1.5px; }

  /* ---- Login ---- */
  .login-wrap{ display:flex; justify-content:center; align-items:center; min-height:50vh; }
  .login-card{ width:100%; max-width:360px; background:var(--ink-2); border:1px solid var(--border-ink); border-radius:6px; padding:26px; display:flex; flex-direction:column; gap:12px; }
  .login-card p{ font-size:13px; color:var(--text-muted); margin:0; text-align:center; }
  .login-card input{ padding:11px 12px; border:1px solid var(--border-ink); border-radius:3px; background:var(--ink); color:var(--text-on-ink); font-size:14px; }
  .login-card button{ background:var(--amber); color:var(--ink); border:none; border-radius:3px; padding:11px; font-weight:700; font-family:'JetBrains Mono',monospace; text-transform:uppercase; font-size:12px; cursor:pointer; }
  .login-card button:disabled{ opacity:0.5; cursor:default; }
  .login-error{ color:var(--red); font-size:12.5px; text-align:center; display:none; }

  /* ---- Resumen ---- */
  .summary{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px; margin-bottom:26px; }
  .summary .card{ background:var(--ink-2); border:1px solid var(--border-ink); border-radius:4px; padding:16px; }
  .summary .card .label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:6px; }
  .summary .card .value{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--amber); }

  /* ---- Tabla ---- */
  .table-wrap{ background:var(--paper); border-radius:4px; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; color:#2a2620; min-width:820px; }
  th{ background:var(--ink); color:var(--paper); text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; user-select:none; white-space:nowrap; }
  th:hover{ background:var(--ink-2); }
  th .arrow{ opacity:0.5; font-size:10px; }
  td{ padding:10px 12px; border-bottom:1px solid var(--paper-2); white-space:nowrap; }
  tr:hover td{ background:#fffdf6; }
  .comp-val{ font-family:'JetBrains Mono',monospace; }
  .weak{ color:var(--red); font-weight:700; }
  .badge-pill{ display:inline-block; background:var(--ink); color:var(--amber); font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; border-radius:3px; margin:1px; }
  .empty-state{ padding:40px; text-align:center; color:#6b6552; }
  .refresh-btn{ background:var(--ink-2); color:var(--text-on-ink); border:1px solid var(--border-ink); border-radius:3px; padding:8px 14px; font-size:12px; cursor:pointer; margin-bottom:14px; }

  /* ---- Pestañas ---- */
  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tab-btn{ background:transparent; color:var(--text-muted); border:1px solid var(--border-ink); border-radius:3px; padding:8px 16px; font-size:13px; cursor:pointer; }
  .tab-btn.active{ background:var(--amber); color:var(--ink); border-color:var(--amber); font-weight:600; }

  /* ---- Justificaciones ---- */
  .filter-row{ display:flex; gap:10px; margin-bottom:14px; align-items:center; }
  .filter-row input{ flex:1; max-width:320px; padding:9px 12px; border:1px solid var(--border-ink); border-radius:3px; background:var(--ink-2); color:var(--text-on-ink); font-size:13px; }
  .just-row{ cursor:pointer; }
  .just-row td{ white-space:normal; }
  .acertada-si{ color:var(--green); font-weight:700; }
  .acertada-no{ color:var(--red); font-weight:700; }
  .just-detail{ display:none; background:#fffdf6; }
  .just-detail.open{ display:table-row; }
  .just-detail td{ padding:16px 18px; white-space:normal; line-height:1.6; }
  .just-detail .field-label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:#8a8674; margin-top:10px; margin-bottom:3px; }
  .just-detail .field-label:first-child{ margin-top:0; }
  .truncate{ max-width:280px; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Panel docente</h1>
      <div class="sub">Expediente lector — progreso de estudiantes</div>
    </div>
  </header>

  <div id="loginZone" class="login-wrap">
    <div class="login-card">
      <p>Este panel es solo para el docente. Ingresa la contraseña para continuar.</p>
      <input type="password" id="pwInput" placeholder="Contraseña" />
      <div class="login-error" id="pwError"></div>
      <button id="pwBtn">Entrar</button>
    </div>
  </div>

  <div id="dashboardZone" style="display:none;">
    <div class="summary" id="summaryZone"></div>
    <div class="tabs">
      <button class="tab-btn active" id="tabEstudiantes">Estudiantes</button>
      <button class="tab-btn" id="tabJustificaciones">Justificaciones</button>
      <button class="refresh-btn" id="refreshBtn" style="margin-bottom:0;">Actualizar datos</button>
    </div>

    <div id="viewEstudiantes">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-key="nombre">Estudiante <span class="arrow"></span></th>
              <th data-key="correo">Correo <span class="arrow"></span></th>
              <th data-key="xp_literal">Literal <span class="arrow"></span></th>
              <th data-key="xp_inferencial">Inferencial <span class="arrow"></span></th>
              <th data-key="xp_critico">Crítico <span class="arrow"></span></th>
              <th data-key="nivel">Nivel <span class="arrow"></span></th>
              <th data-key="casos_resueltos">Casos <span class="arrow"></span></th>
              <th data-key="actualizado_en">Última actividad <span class="arrow"></span></th>
              <th>Insignias</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="viewJustificaciones" style="display:none;">
      <div class="filter-row">
        <input type="text" id="justFilter" placeholder="Filtrar por correo del estudiante..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Estudiante</th>
              <th>Opción elegida</th>
              <th>Justificación (resumen)</th>
              <th>Acertada</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="justBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let students = [];
let justifications = [];
let sortKey = 'actualizado_en';
let sortDir = -1; // -1 desc, 1 asc
let currentPassword = '';
let openJustId = null;

const loginZone = document.getElementById('loginZone');
const dashboardZone = document.getElementById('dashboardZone');
const pwInput = document.getElementById('pwInput');
const pwBtn = document.getElementById('pwBtn');
const pwError = document.getElementById('pwError');

async function fetchData(password){
  const resp = await fetch('/api/docente', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  const data = await resp.json();
  if(!resp.ok) throw new Error(data.error || 'Error desconocido');
  return data;
}

pwBtn.addEventListener('click', async () => {
  const password = pwInput.value;
  if(!password) return;
  pwBtn.disabled = true;
  pwBtn.textContent = 'Verificando...';
  pwError.style.display = 'none';
  try{
    const data = await fetchData(password);
    students = data.estudiantes || [];
    justifications = data.justificaciones || [];
    currentPassword = password;
    loginZone.style.display = 'none';
    dashboardZone.style.display = 'block';
    renderDashboard();
    renderJustificaciones();
  } catch(err){
    pwError.textContent = err.message;
    pwError.style.display = 'block';
  } finally {
    pwBtn.disabled = false;
    pwBtn.textContent = 'Entrar';
  }
});
pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') pwBtn.click(); });

document.getElementById('refreshBtn').addEventListener('click', async () => {
  try{
    const data = await fetchData(currentPassword);
    students = data.estudiantes || [];
    justifications = data.justificaciones || [];
    renderDashboard();
    renderJustificaciones();
  } catch(err){
    alert('No se pudo actualizar: ' + err.message);
  }
});

// ---- Pestañas ----
const tabEstudiantes = document.getElementById('tabEstudiantes');
const tabJustificaciones = document.getElementById('tabJustificaciones');
const viewEstudiantes = document.getElementById('viewEstudiantes');
const viewJustificaciones = document.getElementById('viewJustificaciones');

tabEstudiantes.addEventListener('click', () => {
  tabEstudiantes.classList.add('active');
  tabJustificaciones.classList.remove('active');
  viewEstudiantes.style.display = 'block';
  viewJustificaciones.style.display = 'none';
});
tabJustificaciones.addEventListener('click', () => {
  tabJustificaciones.classList.add('active');
  tabEstudiantes.classList.remove('active');
  viewJustificaciones.style.display = 'block';
  viewEstudiantes.style.display = 'none';
});

document.getElementById('justFilter').addEventListener('input', renderJustificaciones);

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if(sortKey === key){ sortDir *= -1; } else { sortKey = key; sortDir = 1; }
    renderDashboard();
  });
});

function weakestCompetency(s){
  const comps = [['literal', s.xp_literal], ['inferencial', s.xp_inferencial], ['critico', s.xp_critico]];
  comps.sort((a, b) => a[1] - b[1]);
  return comps[0][0]; // la de menor XP
}

function renderDashboard(){
  // Resumen del curso
  const n = students.length || 1;
  const avg = (field) => Math.round(students.reduce((sum, s) => sum + (s[field] || 0), 0) / n);
  document.getElementById('summaryZone').innerHTML = `
    <div class="card"><div class="label">Estudiantes</div><div class="value">${students.length}</div></div>
    <div class="card"><div class="label">Promedio Literal</div><div class="value">${avg('xp_literal')}</div></div>
    <div class="card"><div class="label">Promedio Inferencial</div><div class="value">${avg('xp_inferencial')}</div></div>
    <div class="card"><div class="label">Promedio Crítico</div><div class="value">${avg('xp_critico')}</div></div>
  `;

  // Orden
  const sorted = [...students].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(typeof av === 'string') av = av.toLowerCase();
    if(typeof bv === 'string') bv = bv.toLowerCase();
    if(av < bv) return -1 * sortDir;
    if(av > bv) return 1 * sortDir;
    return 0;
  });

  const tbody = document.getElementById('tableBody');
  if(sorted.length === 0){
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state">Todavía no hay estudiantes registrados.</div></td></tr>';
    return;
  }

  tbody.innerHTML = sorted.map(s => {
    const weak = weakestCompetency(s);
    const fecha = s.actualizado_en ? new Date(s.actualizado_en).toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' }) : '—';
    const badges = Array.isArray(s.badges) && s.badges.length > 0
      ? s.badges.map(b => `<span class="badge-pill">${escapeHtml(b)}</span>`).join('')
      : '<span style="color:#8a8674; font-size:11.5px;">ninguna</span>';
    return `<tr>
      <td>${escapeHtml(s.nombre || '')}</td>
      <td style="font-size:12px; color:#4a4638;">${escapeHtml(s.correo || '')}</td>
      <td class="comp-val ${weak === 'literal' ? 'weak' : ''}">${s.xp_literal ?? 0}</td>
      <td class="comp-val ${weak === 'inferencial' ? 'weak' : ''}">${s.xp_inferencial ?? 0}</td>
      <td class="comp-val ${weak === 'critico' ? 'weak' : ''}">${s.xp_critico ?? 0}</td>
      <td class="comp-val">${s.nivel ?? 1}</td>
      <td class="comp-val">${s.casos_resueltos ?? 0}</td>
      <td style="font-size:12px;">${fecha}</td>
      <td>${badges}</td>
    </tr>`;
  }).join('');
}

function renderJustificaciones(){
  const filter = document.getElementById('justFilter').value.trim().toLowerCase();
  const filtered = filter
    ? justifications.filter(j => (j.correo || '').toLowerCase().includes(filter))
    : justifications;

  const tbody = document.getElementById('justBody');
  if(filtered.length === 0){
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state">No hay justificaciones registradas todavía.</div></td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(j => {
    const fecha = j.creado_en ? new Date(j.creado_en).toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
    const acertadaLabel = j.acertada === true ? '<span class="acertada-si">Sí</span>' : j.acertada === false ? '<span class="acertada-no">No</span>' : '—';
    const resumenJust = (j.justificacion_texto || '').slice(0, 70) + ((j.justificacion_texto || '').length > 70 ? '…' : '');
    const isOpen = openJustId === j.id;
    return `<tr class="just-row" data-id="${j.id}">
        <td style="font-size:12px;">${escapeHtml(j.correo || '')}</td>
        <td class="truncate">${escapeHtml(j.opcion_elegida || '')}</td>
        <td class="truncate">${escapeHtml(resumenJust)}</td>
        <td>${acertadaLabel}</td>
        <td style="font-size:12px;">${fecha}</td>
      </tr>
      <tr class="just-detail ${isOpen ? 'open' : ''}" data-detail-for="${j.id}">
        <td colspan="5">
          <div class="field-label">Pregunta</div>${escapeHtml(j.pregunta || '')}
          <div class="field-label">Opción elegida</div>${escapeHtml(j.opcion_elegida || '')}
          <div class="field-label">Justificación del estudiante</div>${escapeHtml(j.justificacion_texto || '')}
          <div class="field-label">Evaluación de la IA</div>${escapeHtml(j.evaluacion_ia || '(sin evaluación registrada)')}
        </td>
      </tr>`;
  }).join('');

  document.querySelectorAll('.just-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      openJustId = openJustId === id ? null : id;
      renderJustificaciones();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
